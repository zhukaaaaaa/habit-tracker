spring:
  application:
    name: habit-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/habit_tracker}
    username: ${DB_USERNAME:habit_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
server:
  address: 127.0.0.1
  port: ${PORT:8080}
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000
